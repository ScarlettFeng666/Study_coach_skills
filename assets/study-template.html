  const intro=section('先看证据，再安排复习','客观题覆盖与最近正确率按“唯一题目最近一次作答”计算；失误排序使用全部客观作答的“答错次数 / 作答次数”。自评简答单列，未测不等于掌握。');main.append(intro.card);
  const stats=topicStats().sort((a,b)=>(b.attempts?b.misses/b.attempts:-1)-(a.attempts?a.misses/a.attempts:-1)||b.misses-a.misses),table=el('table',null,'report-table'),thead=el('thead'),tr=el('tr');['知识点','客观题覆盖','最近正确','历史失误 / 作答','简答自评 / 待评'].forEach(x=>tr.append(el('th',x)));thead.append(tr);table.append(thead);const body=el('tbody');stats.forEach(s=>{const row=el('tr');row.append(el('td',s.topic.title),el('td',s.tested+'/'+s.objectiveTotal+(s.tested===0?' · 未测':'')),el('td',s.tested?s.tested-s.latestMisses+' / '+s.tested:'—'),el('td',s.misses+' / '+s.attempts+(s.attempts?'（'+Math.round(s.misses/s.attempts*100)+'%）':'')),el('td','已自评 '+s.selfTested+' 题；失误 '+s.selfMisses+'/'+s.selfAttempts+' 次；待评 '+s.pending));body.append(row);});table.append(body);const wrap=el('div',null,'table-scroll');wrap.append(table);intro.card.append(wrap);
  const grid=el('div',null,'topic-grid'),mm=mistakeMap();stats.forEach(s=>{const c=el('article',null,'card'),count=[...mm.values()].filter(m=>m.streak<2&&qmap.get(m.qid).topic_id===s.topic.id).length;c.append(badge(count?'待巩固 '+count+' 题':s.tested?'已测':'客观题未测',count?'bad':s.tested?'good':'warn'),el('h3',s.topic.title),el('p',s.topic.summary,'small prewrap'),el('div','主动回忆：'+s.topic.recall_prompt,'recall'));grid.append(c);});main.append(grid);
}
function truncate(text,max){return text.length<=max?text:text.slice(0,max-1)+'…';}
function fiveTopics(){const mm=mistakeMap(),stats=topicStats(),rank=stats.map((s,index)=>{const unresolved=[...mm.values()].filter(m=>m.streak<2&&qmap.get(m.qid).topic_id===s.topic.id).length;return{...s,unresolved,index};}).sort((a,b)=>b.unresolved-a.unresolved||(b.attempts?b.misses/b.attempts:-1)-(a.attempts?a.misses/a.attempts:-1)||a.index-b.index);return rank.slice(0,6);}
function renderFive(main){const intro=section('考前 5 分钟，把重点再过一遍','先回忆，再看提示。优先覆盖待巩固错题，再看历史失误与其他核心主题。最多 6 个主题、约 1,300 个中文字符；这是一份快速回顾，不代表完整考试范围。');intro.head.append(button('导出这份速通清单',()=>download('five-minute-'+safeName(pack.pack_id)+'.md',fiveMarkdown(),'text/markdown;charset=utf-8')));main.append(intro.card);const sheet=el('div',null,'five-sheet');fiveTopics().forEach((s,i)=>{const t=s.topic,c=el('article',null,'card'),head=el('div',null,'five-title');head.append(el('div',(i+1)+'. '+truncate(t.title,30),'priority'),badge(s.unresolved?'待巩固 '+s.unresolved+' 题':s.tested?'客观题已测':'客观题未测',s.unresolved?'bad':s.tested?'good':'warn'));c.append(head,el('p',truncate(t.quick_tip||t.summary,80),'summary'),el('div','闭眼回忆：'+truncate(t.recall_prompt,50),'recall'),el('p','容易踩坑：'+truncate(t.pitfalls[0]||'留意题干条件、范围与例外。',35),'trap'));sheet.append(c);});main.append(sheet);}
function renderSources(main){const intro=section('学习范围、来源与用时','题目依据当前提供的资料生成或改编。未核验的出处不能当作已经证实的课程要求；资料中若有互相冲突的内容，需要向授课方确认。');main.append(intro.card);intro.card.append(el('p',pack.notice||'请以授课教师发布的考试范围和评分要求为准。','prewrap'));const plan=el('div',null,'row');[['练习',pack.plan.practice_minutes],['模考',pack.plan.mock_minutes],['复盘',pack.plan.review_minutes]].forEach(([label,n])=>plan.append(badge(label+' '+n+' 分钟','good')));intro.card.append(plan,el('p',pack.plan.rationale,'small prewrap'));pack.sources.forEach(s=>{const row=el('div',null,'source-item');row.append(badge({verified:'已核对资料',unverified:'未核验',general:'通用知识'}[s.status],s.status==='verified'?'good':'warn'),el('h3',s.label),el('p',s.detail,'small prewrap'));intro.card.append(row);});intro.card.append(el('p','题包 ID：'+pack.pack_id+' · 内容指纹：'+fp,'small muted'));}
function safeName(value){return value.replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,70)||'study-pack';}
function download(name,text,type){const blob=new Blob([text],{type}),url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);}
function fiveMarkdown(){const lines=['# '+pack.title+' · 考前 5 分钟','',pack.notice,'','最多 6 个主题；优先待巩固错题。未测主题不代表已掌握。',''];fiveTopics().forEach((s,i)=>{lines.push('## '+(i+1)+'. '+truncate(s.topic.title,30)+'（'+(s.unresolved?'待巩固 '+s.unresolved+' 题':s.tested?'客观题已测':'客观题未测')+'）','',truncate(s.topic.quick_tip||s.topic.summary,80),'','- 主动回忆：'+truncate(s.topic.recall_prompt,50),'- 易错：'+truncate(s.topic.pitfalls[0]||'留意题干条件、范围与例外。',35),'');});return lines.join('\n');}
function learningReport(){
  const stats=topicStats(),mm=[...mistakeMap().values()],lines=['# '+pack.title+' · 学习报告','', '导出时间：'+stamp(Date.now()),'题包：'+pack.pack_id+' / '+fp,'',pack.notice,'','客观覆盖按唯一题目最近一次计；失误比例按全部客观作答计。简答为学生自评，不纳入客观分。','未测内容无法据此判断掌握情况。以下答案为题包设定的参考答案，不自动代表已经教师或原课件核验；请结合逐题来源状态判断。','','## 知识点诊断',''];
  stats.forEach(s=>lines.push('- '+s.topic.title+'：客观覆盖 '+s.tested+'/'+s.objectiveTotal+'；最近正确 '+(s.tested-s.latestMisses)+'/'+s.tested+'；历史失误 '+s.misses+'/'+s.attempts+' 次；简答自评失误 '+s.selfMisses+'/'+s.selfAttempts+' 次；待评 '+s.pending+' 次。'));
  lines.push('','## 历史错题','');if(!mm.length)lines.push('暂无历史错题。');mm.forEach(m=>{const q=qmap.get(m.qid);lines.push('- ['+(m.streak>=2?'已巩固':'待巩固')+'] '+q.id+' · '+q.prompt.replace(/\n/g,' ')+'；历史失误 '+m.misses+' 次；连续答对 '+m.streak+'/2'+(q.type==='short'?'；含学生自评 / 空题':''));});
  lines.push('','## 全部作答记录','');
  state.attempts.forEach(a=>{
    const q=qmap.get(a.qid),answer=q.type==='short'?a.answer:a.answer.map(i=>String.fromCharCode(65+i)+'. '+q.options[i]).join('；');
    lines.push('### '+a.qid+' · '+stamp(a.submittedAt),'','考点：'+tmap.get(q.topic_id).title,'模式：'+a.mode+'；结果：'+(a.correct===null?'待自评':a.correct?'正确':'错误')+(a.selfGraded?'（学生自评，不计客观分）':''),'','题目：'+q.prompt,'');
    if(q.type!=='short'){q.options.forEach((text,i)=>lines.push('- '+String.fromCharCode(65+i)+'. '+text));lines.push('','正确答案（题包设定）：'+q.answer.map(i=>String.fromCharCode(65+i)+'. '+q.options[i]).join('；'));}
    else{lines.push('参考答案（题包设定）：'+q.reference_answer,'','评分要点：');q.rubric.forEach(point=>lines.push('- '+point));}
    lines.push('','学生作答：'+(answer||'未作答'),'','原题包解析：'+q.explanation);
    if(q.type!=='short')q.option_explanations.forEach((text,i)=>lines.push('- '+String.fromCharCode(65+i)+' 选项解析：'+text));
    lines.push('','题目来源类型：'+{adapted:'依资料改编',generated:'生成练习',provided:'用户提供原题'}[q.origin]);
    if(!q.source_ids.length)lines.push('未标注具体出处。');
    q.source_ids.forEach(id=>{const s=smap.get(id);lines.push('- '+s.label+' ['+{verified:'已核对资料',unverified:'未核验',general:'通用知识'}[s.status]+']：'+s.detail);});
    lines.push('');
  });
  lines.push('',fiveMarkdown());return lines.join('\n');
}
function backup(){return{format:'exam-study-progress',version:1,pack_id:pack.pack_id,fingerprint:fp,exported_at:new Date().toISOString(),progress:state};}
function reportJSON(){const attempted=new Set(state.attempts.map(a=>a.qid));return{format:'exam-study-report',version:1,pack_id:pack.pack_id,fingerprint:fp,exported_at:new Date().toISOString(),title:pack.title,notice:pack.notice,answer_caveat:'答案为题包设定，不自动代表已经教师或原课件核验，请结合来源状态判断。',sources:pack.sources,coverage_definition:'客观覆盖按唯一题目最近一次；失误比例按全部客观作答。学生自评单列，未测不能判断掌握。',topics:topicStats(),questions:pack.questions.filter(q=>attempted.has(q.id)),mistakes:[...mistakeMap().values()].map(m=>({...m,resolved:m.streak>=2,question:qmap.get(m.qid).prompt})),attempts:state.attempts,mocks:state.mocks,five_minute:fiveMarkdown()};}
function mergeProgress(incoming){
  const current=JSON.parse(JSON.stringify(state)),byAttempt=new Map(current.attempts.map(a=>[a.id,a]));
  for(const a of incoming.attempts){const previous=byAttempt.get(a.id);if(!previous){current.attempts.push(a);byAttempt.set(a.id,a);continue;}const left={...previous,correct:null,selfGraded:false},right={...a,correct:null,selfGraded:false};requireThat(stableString(left)===stableString(right),'备份中存在同 ID 但内容不同的作答');if(previous.correct===null&&a.selfGraded){Object.assign(previous,a);}else if(a.correct!==null&&previous.correct!==null)requireThat(previous.correct===a.correct&&previous.selfGraded===a.selfGraded,'备份自评结果与现有记录冲突');}
  current.attempts.sort((a,b)=>a.submittedAt-b.submittedAt);
  const byMock=new Map(current.mocks.map(m=>[m.id,m]));for(const m of incoming.mocks){const previous=byMock.get(m.id);if(!previous){current.mocks.push(m);byMock.set(m.id,m);}else if(previous.status==='active'&&m.status==='submitted'){Object.assign(previous,m);}else if(previous.status===m.status){requireThat(stableString(previous)===stableString(m),'备份与现有模考记录冲突');}}
  current.practice=incoming.practice;current.view=current.mocks.some(m=>m.status==='active')?'mock':incoming.view;return validateProgress(current);
}
async function importFile(file){
  if(!file)return;try{requireThat(file.size<=20*1024*1024,'备份文件超过 20 MB');const incoming=JSON.parse(await file.text());exactKeys(incoming,['format','version','pack_id','fingerprint','exported_at','progress'],'备份');requireThat(incoming.format==='exam-study-progress'&&incoming.version===1&&incoming.pack_id===pack.pack_id&&incoming.fingerprint===fp,'这份备份不属于当前题包或当前内容版本，无法恢复');requireThat(typeof incoming.exported_at==='string'&&Number.isFinite(Date.parse(incoming.exported_at)),'导出时间格式错误');validateProgress(incoming.progress);if(!confirm('恢复将合并作答与错题历史，并采用备份中的练习草稿。'+(activeMock()?'当前模考会先交卷并保留。':'')+'确定继续？'))return;const m=activeMock();if(m)submitMock(m,false);const merged=mergeProgress(incoming.progress);state=merged;save();render();announce('已合并备份进度，现有作答历史已保留。');}catch(err){announce('恢复失败：'+err.message);}}
$('pack-title').textContent=pack.title;$('pack-subtitle').textContent=pack.subtitle;document.title=pack.title+' · Study Coach';
const unverified=pack.sources.some(s=>s.status==='unverified');if(pack.notice||unverified){$('pack-notice').hidden=false;$('pack-notice').textContent=(pack.notice||'')+(unverified?'\n资料提示：本题包包含未核验来源，相关题目与结论需要对照原课件确认。':'');}
$('export-progress').addEventListener('click',()=>{download('study-progress-'+safeName(pack.pack_id)+'.json',JSON.stringify(backup(),null,2),'application/json');announce('进度备份已生成，包含作答、错题历史与模考截止时间。');});
$('import-progress').addEventListener('click',()=>$('import-file').click());$('import-file').addEventListener('change',event=>{importFile(event.target.files[0]);event.target.value='';});
$('export-report').addEventListener('click',()=>{if(activeMock())return;download('study-report-'+safeName(pack.pack_id)+'.md',learningReport(),'text/markdown;charset=utf-8');announce('已生成包含作答记录、薄弱点与速通清单的学习报告。');});
$('export-report-json').addEventListener('click',()=>{if(activeMock())return;download('study-report-'+safeName(pack.pack_id)+'.json',JSON.stringify(reportJSON(),null,2),'application/json');announce('已生成结构化学习报告；恢复进度请使用“备份进度 JSON”。');});
$('print-sheet').addEventListener('click',()=>{if(!activeMock())window.print();});
$('reset-progress').addEventListener('click',()=>{if(!confirm('确定清空当前题包、当前内容版本的全部作答、错题和模考历史？此操作不可撤销，其他题包不受影响。建议先备份。'))return;state=newProgress();try{localStorage.removeItem(storageKey);}catch(err){storageWarning('浏览器无法删除已存储的进度。');}save();render();announce('当前题包进度已重置。');});
window.addEventListener('beforeunload',event=>{if(activeMock()){event.preventDefault();event.returnValue='';}});
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimer();});
window.addEventListener('focus',updateTimer);
render();timerId=setInterval(updateTimer,1000);
})();
</script>
